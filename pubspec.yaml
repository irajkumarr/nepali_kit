name: nepali_kit
description: Comprehensive BS/AD calendar and Nepali localization toolkit for Dart and Flutter.
version: 1.0.3
homepage: https://nepalikit.tech
repository: https://github.com/irajkumarr/nepali_kit
issue_tracker: https://github.com/irajkumarr/nepali_kit/issues

topics:
  - calendar
  - nepali
  - bikram-sambat
  - date-picker
  - localization

screenshots:
  - description: "Bikram Sambat (BS) Calendar view with full Nepali localization"
    path: screenshots/bs-calendar.jpeg
  - description: "Dual BS + AD Calendar displaying both calendars simultaneously"
    path: screenshots/dual-calendar.jpeg
  - description: "Material 3 Bikram Sambat Date Picker dialog"
    path: screenshots/date-picker.jpeg
  - description: "Bikram Sambat Date Range Picker dialog"
    path: screenshots/date-range-picker.jpeg
  - description: "Bidirectional BS ↔ AD Date Conversion"
    path: screenshots/date-conversion.jpeg
  - description: "Nepal Government Fiscal Year and Quarters"
    path: screenshots/fiscal-year.jpeg

environment:
  sdk: "^3.3.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.25.0
